<!DOCTYPE html>
<html>
<head>
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>LabSentry Remote</title>
  <style>
    body {
      font-family: Arial, sans-serif;
      text-align: center;
      padding: 40px 20px;
      background: #f4f6f8;
    }
    button {
      width: 100%;
      padding: 25px;
      font-size: 22px;
      margin-top: 20px;
      border: none;
      border-radius: 12px;
      color: white;
    }
    #lockBtn { background: #f59e0b; }
    #logoutBtn { background: #dc2626; }
  </style>
</head>

<body>
  <h1>LabSentry Remote</h1>
  <p>Controlling session: <b id="sessionId"></b></p>

  <button id="lockBtn">Lock Screen</button>
  <button id="logoutBtn">Log Out Now</button>
  <p id="status"></p>

  <script>
    // Read the session number from the link
    var params = new URLSearchParams(window.location.search);
    document.getElementById("sessionId").innerText = params.get("session");

    document.getElementById("lockBtn").addEventListener("click", function () {
      document.getElementById("status").innerText = "Lock button pressed (not connected yet).";
    });

    document.getElementById("logoutBtn").addEventListener("click", function () {
      document.getElementById("status").innerText = "Logout button pressed (not connected yet).";
    });
  </script>
</body>
</html>
